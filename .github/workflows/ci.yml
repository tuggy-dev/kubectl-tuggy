name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -o bin/ ./cmd/kubectl-tuggy
      # macOS runners don't include kubectl; install it everywhere so all
      # three operating systems run the same check.
      - uses: azure/setup-kubectl@v5
      - name: Smoke test as a kubectl plugin
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          # Informational: plugin list also reports unrelated plugins.
          kubectl plugin list || true
          # The check: kubectl finds and runs the plugin.
          kubectl tuggy version
